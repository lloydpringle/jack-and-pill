<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFF9F3">
<title>Jack and Pill</title>
<style>
:root{
  color-scheme:light only;
  --cream:#FFF9F3; --card:#FFFFFF; --blush:#FCEAE6; --blush-deep:#F9DDD7;
  --blush-border:#F2B6AD; --coral:#EE5A4F; --coral-dark:#D94A40;
  --ink:#2E2A33; --ink-soft:#9A93A3; --ink-mid:#6E6878;
  --amber:#F5A93B; --amber-deep:#E08A26; --navy:#262A3F;
  --good:#F5A93B; --line:#F1E8E0;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:#FFF9F3 !important}
body{
  font-family:"SF Pro Rounded",ui-rounded,"Nunito","Quicksand",-apple-system,system-ui,sans-serif;
  background:#FFF9F3 !important; color:var(--ink); overscroll-behavior-y:none;overflow-x:hidden;
  -webkit-font-smoothing:antialiased; user-select:none;-webkit-user-select:none;
}
input,textarea{user-select:text;-webkit-user-select:text}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.on{display:flex}

/* ---------- shared ---------- */
.btn{
  display:block;width:100%;padding:17px 20px;border-radius:999px;
  background:var(--coral);color:#fff;font-size:17px;font-weight:800;
  letter-spacing:.2px;text-align:center;transition:transform .15s ease,opacity .2s;
  box-shadow:0 6px 18px rgba(238,90,79,.28);
}
.btn:active{transform:scale(.97)}
.btn.dis{opacity:.35;pointer-events:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink-mid);box-shadow:none;font-weight:700}
.btn.navy{background:var(--navy);box-shadow:0 6px 18px rgba(38,42,63,.25)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--coral)}
h1{font-size:28px;font-weight:800;letter-spacing:-.4px;line-height:1.18}
h2{font-size:21px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:15.5px;line-height:1.5;color:var(--ink-mid);font-weight:600}
.reveal{opacity:0;transform:translateY(14px);animation:rise .55s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{to{opacity:1;transform:none}}
.ob-body.slide-fwd{animation:slideFwd .5s cubic-bezier(.16,.84,.3,1)}
.ob-body.slide-back{animation:slideBack .5s cubic-bezier(.16,.84,.3,1)}
@keyframes slideFwd{0%{opacity:0;transform:translateX(110%)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes slideBack{0%{opacity:0;transform:translateX(-110%)}60%{opacity:1}100%{opacity:1;transform:none}}
.depth{box-shadow:0 1px 2px rgba(46,42,51,.04),0 8px 18px rgba(46,42,51,.07),0 18px 40px rgba(46,42,51,.06)}
.opt,.pick{box-shadow:0 2px 5px rgba(46,42,51,.05),0 10px 22px rgba(46,42,51,.05)}
.opt:active{transform:scale(.98) translateY(1px)}
@media (prefers-reduced-motion:reduce){
  .reveal{animation:none;opacity:1;transform:none}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ---------- onboarding ---------- */
#ob{padding:max(20px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));overflow:hidden}
.ob-top{display:flex;align-items:center;gap:14px;min-height:34px}
.ob-back{width:38px;height:38px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-mid);box-shadow:0 2px 8px rgba(46,42,51,.07);visibility:hidden}
.ob-back.show{visibility:visible}
.ob-prog{flex:1;height:6px;border-radius:99px;background:var(--blush);overflow:hidden;visibility:hidden}
.ob-prog.show{visibility:visible}
.ob-prog i{display:block;height:100%;border-radius:99px;background:var(--coral);transition:width .4s cubic-bezier(.2,.9,.3,1);width:0}
.ob-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0}
.ob-foot{padding-top:10px}
.center{text-align:center}
.jar-wrap{display:flex;justify-content:center;margin:10px 0 18px}
.glowwrap{display:flex;flex-direction:column;align-items:center}
.glow{display:flex;align-items:center;justify-content:center;width:256px;height:256px;border-radius:50%;
  background:radial-gradient(circle,rgba(242,166,156,.42) 0%,rgba(242,166,156,.16) 45%,rgba(242,166,156,0) 70%)}
.groundshadow{width:98px;height:15px;border-radius:50%;background:rgba(46,42,51,.10);margin-top:-16px}
.splash-h{font-size:30px;letter-spacing:-.5px}
.opt{
  display:flex;align-items:center;gap:13px;width:100%;padding:17px 18px;margin-top:12px;
  background:var(--card);border:2px solid transparent;border-radius:var(--r-md);
  font-size:16.5px;font-weight:700;text-align:left;
  box-shadow:0 3px 12px rgba(46,42,51,.05);transition:transform .12s,border-color .15s,background .15s;
}
.opt:active{transform:scale(.98)}
.opt.sel{background:var(--blush);border-color:var(--blush-border)}
.opt .em{font-size:21px;width:28px;text-align:center}
.opt small{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:2px}
.opt .tail{margin-left:auto;font-size:12px;font-weight:800;color:var(--coral);background:#fff;border-radius:99px;padding:4px 10px;display:none}
.opt.rec .tail{display:block}
/* toggle rows on picks screen */
.pick{display:flex;align-items:center;gap:13px;padding:15px 16px;margin-top:11px;background:var(--card);border-radius:var(--r-md);box-shadow:0 3px 12px rgba(46,42,51,.05)}
.pick .em{font-size:24px}
.pick .nm{font-size:16px;font-weight:800}
.pick .ds{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:1px}
.poptag{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--coral);background:var(--blush);border-radius:99px;padding:4px 9px;flex:none}
.tog{margin-left:auto;width:52px;height:31px;border-radius:99px;background:#E9E2DA;position:relative;transition:background .2s;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:left .2s cubic-bezier(.2,.9,.3,1.3)}
.tog.on{background:var(--coral)}
.tog.on i{left:24px}
/* loading */
.loadjar{margin:0 auto 22px;display:flex;justify-content:center}
.loadjar svg{transition:none}
.fact{background:var(--blush);border-radius:var(--r-md);padding:20px;font-size:16.5px;font-weight:700;line-height:1.55;color:var(--ink);min-height:104px;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .2s}
.fact b{color:var(--coral)}
/* mini demo */
.demo-row{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:var(--r-md);padding:16px;box-shadow:0 4px 14px rgba(46,42,51,.07);margin:16px auto 0;max-width:330px}
.timepick{display:flex;justify-content:center;margin-top:18px}
.timepick input{font-family:inherit;font-size:34px;font-weight:800;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:var(--r-md);padding:10px 16px;text-align:center}
.dotsrow{display:flex;gap:9px;justify-content:center;margin-top:18px}
.dotsrow .d{width:30px;height:30px;border-radius:50%;background:var(--blush);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ink-soft)}
.dotsrow .d.f{background:var(--amber);color:#fff}
.confetti{position:absolute;width:9px;height:9px;border-radius:2px;animation:conf 1.1s ease-out forwards;pointer-events:none;z-index:50}
.phonemock{margin:22px auto 0;width:236px;background:#fff;border-radius:24px;box-shadow:0 14px 36px rgba(46,42,51,.16);border:1px solid var(--line);overflow:hidden}
.pm-screen{padding:16px 15px 18px;text-align:left}
.pm-head{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:12px}
.pm-field{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-height:46px;display:flex;flex-direction:column;justify-content:center;position:relative;transition:border-color .2s}
.pm-field.focus{border-color:var(--blush-border);background:#FFFDFB}
.pm-lbl{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft)}
.pm-val{font-size:15px;font-weight:700;color:var(--ink);min-height:18px}
.pm-cursor{position:absolute;left:12px;bottom:11px;width:2px;height:17px;background:var(--coral);animation:blink 1s step-end infinite;display:none}
@keyframes blink{50%{opacity:0}}
.pm-row{display:flex;gap:8px;margin-top:9px}
.pm-half{flex:1}
.pm-btn{width:100%;margin-top:12px;padding:12px;border-radius:999px;background:var(--coral);color:#fff;font-size:14.5px;font-weight:800;text-align:center;transition:transform .12s,box-shadow .2s;box-shadow:0 4px 12px rgba(238,90,79,.28)}
.pm-btn.press{transform:scale(.94);box-shadow:0 2px 6px rgba(238,90,79,.3)}
.pm-list{max-height:0;opacity:0;overflow:hidden;transition:max-height .4s cubic-bezier(.2,.9,.3,1),opacity .3s,margin-top .3s;margin-top:0}
.pm-list.show{max-height:80px;opacity:1;margin-top:11px}
.pm-item{display:flex;align-items:center;gap:10px;background:var(--blush);border-radius:12px;padding:10px 12px;animation:pmdrop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pmdrop{0%{transform:translateY(-12px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
.pm-item>span:first-child{font-size:20px}
.pm-item b{font-size:14px;font-weight:800;display:block}
.pm-item i{font-size:12px;color:var(--ink-soft);font-style:normal;font-weight:600}
.pm-check{margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:800}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}

/* ---------- app shell ---------- */
#app{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.page{display:none;padding:max(18px,env(safe-area-inset-top)) 20px 20px}
.page.on{display:block;animation:pgIn .42s cubic-bezier(.16,.84,.3,1)}
@keyframes pgIn{0%{opacity:0;transform:translateY(26px) scale(.97)}100%{opacity:1;transform:none}}
.apphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.apphead .date{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
.apphead h1{font-size:26px}
.streakpill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:8px 13px;font-size:14px;font-weight:800;box-shadow:0 3px 10px rgba(46,42,51,.07)}
.streakpill .fl{font-size:16px}
.freezerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.freezechip{font-size:12px;font-weight:800;color:#3E7CB1;background:#E8F2FA;border-radius:99px;padding:5px 11px}
.freezechip.used{color:#7A6AAE;background:#EFEAF9}
/* share card */
.sharecard{background:linear-gradient(160deg,#FFF9EE,#FFEFDC);border:2px solid #F2DDBE;border-radius:22px;padding:22px 18px 16px;text-align:center;box-shadow:0 6px 18px rgba(46,42,51,.08)}
.sc-jar{display:flex;justify-content:center;margin-bottom:6px}
.sc-big{font-size:21px;font-weight:900;color:var(--ink)}
.sc-dots{display:flex;justify-content:center;gap:7px;margin:10px 0 8px}
.scdot{width:13px;height:13px;border-radius:50%;background:var(--line)}
.scdot.good{background:#3FAE85}
.scdot.miss{background:#E8A48F}
.scdot.neu{background:#D9D3CB}
.scdot.fut{background:transparent;border:2px dashed var(--line)}
.sc-streak{font-size:14px;font-weight:800;color:var(--ink-mid)}
.sc-foot{margin-top:12px;padding-top:10px;border-top:1px dashed #E8D6B8;font-size:12px;font-weight:800;color:#B08D57;letter-spacing:.02em}
.sharebtn{display:block;width:100%;margin:0 0 14px;padding:13px;border:2px solid var(--line);border-radius:16px;background:var(--card);font-family:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 3px 10px rgba(46,42,51,.06)}
.sharebtn:active{transform:scale(.98)}
/* founder */
.founderbadge{display:inline-block;margin-top:18px;padding:9px 18px;border-radius:99px;background:linear-gradient(135deg,#FFE9B8,#FFD98F);color:#8A6320;font-size:14px;font-weight:900;box-shadow:0 4px 12px rgba(176,141,87,.25)}
.founderclaim{margin-left:auto;flex:none;padding:8px 14px;border:none;border-radius:99px;background:#3E7CB1;color:#fff;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}
/* milestone in celebration */
.cel-mile{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px;padding:10px 14px;background:#FFF6E3;border:2px solid #F2DDBE;border-radius:16px;font-size:13.5px;font-weight:800;color:#8A6320;max-width:290px;text-align:left}
.cm-jar{flex:none;display:flex}
/* tester stats */
.statrow{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;color:var(--ink-mid)}
.statrow:last-child{border-bottom:none}
.statrow b{color:var(--ink)}
.pick .arr{color:var(--ink-soft);font-size:17px;opacity:.6}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:800;color:var(--ink-soft);border-radius:14px}
.tab .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.55;transition:transform .15s}
.tab.on{color:var(--coral)}
.tab.on .ic{filter:none;opacity:1;transform:scale(1.12)}

/* today */
.jarhero{display:flex;flex-direction:column;align-items:center;margin:6px 0 4px;position:relative}
.jartap{margin-top:6px;font-size:12px;font-weight:800;color:var(--ink-mid);background:var(--card);border-radius:99px;padding:6px 13px;box-shadow:0 2px 8px rgba(46,42,51,.08)}
.jartap:active{transform:scale(.95)}
.skingrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px;padding-bottom:6px}
.wardtier{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--coral);margin-top:18px}
.wardtierd{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
.skincard{position:relative;background:var(--card);border:2.5px solid transparent;border-radius:var(--r-md);padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 12px rgba(46,42,51,.05);transition:transform .12s,border-color .15s}
.skincard:active{transform:scale(.97)}
.skincard.sel{border-color:var(--coral);background:var(--blush)}
.skincard.locked{opacity:.62}
.skinjar{height:88px;display:flex;align-items:center;justify-content:center}
.skinname{font-size:14.5px;font-weight:800;margin-top:6px}
.skinblurb{font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-top:1px}
.skinbadge{margin-top:8px;font-size:11px;font-weight:800;color:#fff;background:var(--coral);border-radius:99px;padding:3px 10px}
.skinlock{position:absolute;top:10px;right:10px;font-size:15px}
.jarsum{font-size:15px;font-weight:800;color:var(--ink-mid);margin-top:8px}
.jarsum b{color:var(--coral)}
.weekdots{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.wd{width:34px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--ink-soft)}
.wd .c{width:26px;height:26px;border-radius:50%;background:var(--blush);display:flex;align-items:center;justify-content:center;font-size:12px}
.wd.good .c{background:var(--amber);color:#fff}
.wd.part .c{background:linear-gradient(to top,var(--amber) 50%,var(--blush) 50%)}
.wd.today .c{box-shadow:0 0 0 2.5px var(--coral)}
.wd.future .c{opacity:.45}
.banner{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:var(--r-md);padding:15px 16px;margin:14px 0 4px;box-shadow:0 6px 18px rgba(38,42,63,.25)}
.banner .tx{flex:1;font-size:14.5px;font-weight:700;line-height:1.35}
.banner .go{background:#fff;color:var(--navy);font-weight:800;font-size:13.5px;border-radius:99px;padding:9px 14px;flex:none}
.lowbanner{display:flex;align-items:center;gap:11px;background:#FFF3E6;border:1.5px solid #F2C795;border-radius:var(--r-md);padding:13px 15px;margin:14px 0 4px}
.lowbanner .lbic{font-size:20px;flex:none}
.lowbanner .tx{flex:1;font-size:14px;font-weight:700;line-height:1.35;color:#8A5A1E}
.stockchip{font-size:11px;font-weight:800;color:var(--ink-mid);background:var(--cream);border-radius:99px;padding:4px 9px;flex:none;white-space:nowrap}
.stockchip.low{color:#B5701A;background:#FFEBD2}
.sect{margin-top:20px}
.sect h3{font-size:13px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;padding-left:4px}
.row{
  display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-md);
  padding:13px 14px;margin-top:10px;box-shadow:0 2px 5px rgba(46,42,51,.04),0 10px 22px rgba(46,42,51,.05);
  transition:background .25s,opacity .25s;position:relative;
}
.row .em{font-size:25px;width:32px;text-align:center;flex:none}
.row .info{flex:1;min-width:0}
.row .nm{font-size:16px;font-weight:800}
.row .ds{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:1px}
.row.taken{background:var(--blush)}
.row.skipped{opacity:.55}
.row.notneeded{opacity:.8}
.row .chip{display:inline-block;font-size:11px;font-weight:800;color:var(--ink-mid);background:var(--cream);border-radius:99px;padding:3px 9px;margin-top:4px}
.row .chip.ok{color:#3FAE85;background:#E6F6EF}
.ctl{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ctl.skip{font-size:17px;font-weight:800;color:var(--ink-mid);background:#fff;border:2.5px solid var(--line);border-radius:50%}
.ctl.take{border:2.5px solid var(--blush-border);background:#fff;font-size:20px;color:transparent;transition:background .18s,border-color .18s,transform .12s}
.ctl.take:active{transform:scale(.9)}
.row.taken .ctl.take{background:var(--coral);border-color:var(--coral);color:#fff}
.row.taken .ctl.skip{visibility:hidden}
.empty{background:var(--card);border-radius:var(--r-lg);padding:34px 24px;text-align:center;margin-top:16px;box-shadow:0 3px 12px rgba(46,42,51,.05)}
.empty .big{font-size:42px;margin-bottom:10px}

/* stack page */
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;margin-top:14px;border:2.5px dashed var(--blush-border);border-radius:var(--r-md);font-size:15.5px;font-weight:800;color:var(--coral)}
.gear{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 10px rgba(46,42,51,.07)}
.row .arr{color:var(--ink-soft);font-size:17px;opacity:.6}
.handle{width:30px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:20px;flex:none;margin-left:-6px;touch-action:none;cursor:grab}
.pausetag{font-size:11px;font-weight:800;color:#fff;background:var(--ink-soft);border-radius:99px;padding:3px 9px}

/* weeks page */
.card{background:var(--card);border-radius:var(--r-lg);padding:18px;margin-top:14px;box-shadow:0 3px 12px rgba(46,42,51,.05)}
.bigstreak{display:flex;align-items:center;gap:14px}
.bigstreak .fl{font-size:40px}
.bigstreak .n{font-size:30px;font-weight:800;line-height:1}
.bigstreak .l{font-size:13.5px;font-weight:700;color:var(--ink-mid);margin-top:3px}
.wkrow{padding:14px 2px;border-bottom:1px solid var(--line)}
.wkrow:last-child{border-bottom:none}
.wkmain{display:flex;flex-direction:column;gap:8px}
.wktop{display:flex;align-items:center;justify-content:space-between}

const $=s=>document.querySelector(s);
const SKEY="stacked-v1";
/* STORAGE-ADAPTER-START ===========================================
   On claude.ai, window.storage exists and is used untouched. Elsewhere (e.g. Vercel) this
   installs the same async get/set/delete interface over localStorage, with the same return
   shapes, so load(), save() and reset never change. Every localStorage call is guarded:
   a throw or a missing localStorage returns null, so save() shows "Saving unavailable".
   localStorage is permitted ONLY between these markers (run.sh enforces it). */
(function(){
  if(window.storage)return;
  function ls(){try{return window.localStorage||null;}catch(e){return null;}}
  window.storage={
    async get(key){
      const st=ls();if(!st)throw new Error("storage unavailable");
      let v;try{v=st.getItem(key);}catch(e){throw new Error("storage unavailable");}
      if(v===null)throw new Error("key not found"); // same as claude.ai: missing keys throw
      return {key,value:v,shared:false};
    },
    async set(key,value){
      const st=ls();if(!st)return null;
      try{st.setItem(key,value);return {key,value,shared:false};}catch(e){return null;}
    },
    async delete(key){
      const st=ls();if(!st)return null;
      try{st.removeItem(key);return {key,deleted:true,shared:false};}catch(e){return null;}
    }
  };
})();
/* STORAGE-ADAPTER-END ============================================= */

];

 training:["Creatine","Omega 3","Magnesium","Vitamin D3","Collagen","Zinc","Vitamin C","Vitamin K2","B12","Acidophilus","Ashwagandha","Iron","Protein Powder","Peptides"],
 energy:["B12","Vitamin D3","Iron","Magnesium","Omega 3","Vitamin C","Creatine","Zinc","Vitamin K2","Acidophilus","Ashwagandha","Collagen","Protein Powder","Peptides"],
 sleep:["Magnesium","Ashwagandha","Omega 3","Vitamin D3","Zinc","B12","Vitamin C","Vitamin K2","Acidophilus","Creatine","Collagen","Iron","Protein Powder","Peptides"],
 health:["Vitamin D3","Omega 3","Vitamin C","Magnesium","Zinc","Acidophilus","Vitamin K2","B12","Iron","Collagen","Creatine","Ashwagandha","Protein Powder","Peptides"]
};
function buildPicks(goal){
  const order=GOAL_ORDER[goal]||GOAL_ORDER.health;
  return order.map((nm,i)=>{
    const q=QUICK.find(x=>x.n===nm);
    return {name:q.n,emoji:q.e,dose:q.d,unit:q.u,slot:q.sl,wf:q.wf,freq:"daily",on:false,pop:i<3};
  });
}

/* ---------- state ---------- */
let state={v:1,onboarded:false,
  profile:{age:"30s",goal:"training",weeklyTarget:5,reminderTime:"08:00"},
  supps:[],logs:{},checkins:{}};
let storageOK=true, saveT=null;

async function load(){
  try{const r=await window.storage.get(SKEY);
    if(r&&r.value){const d=JSON.parse(r.value); if(d&&d.v===1) state=d;}
  }catch(e){/* no saved data yet, or storage unavailable — start fresh */}
  if(!Array.isArray(state.events))state.events=[];
  if(!Array.isArray(state.profile.milestones))state.profile.milestones=[];
}
function track(e){
  if(!Array.isArray(state.events))state.events=[];
  state.events.push({e,t:Date.now()});
  if(state.events.length>600)state.events=state.events.slice(-500);
  save();
}
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{const r=await window.storage.set(SKEY,JSON.stringify(state));
      if(!r&&storageOK){storageOK=false;toast("Saving unavailable — data lives in this session only");}
    }catch(e){if(storageOK){storageOK=false;toast("Saving unavailable — data lives in this session only");}}
  },250);
}

/* ---------- date helpers (all local time) ---------- */
const p2=n=>String(n).padStart(2,"0");
function dkey(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function today(){return new Date();}
function tkey(){return dkey(today());}
function fromKey(k){const a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const off=(x.getDay()+6)%7;return addDays(x,-off);}
function fmtDate(d){return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});}
function fmtShort(d){return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});}

// MONETISATION (decided): option (a) — the free tier has NO supplement cap, ever.
// Pro = insights, wardrobe, exports, themes. Price model still undecided.
// FORGIVING=true unlocks Pro features for testers and keeps the Pro row hidden.
const FORGIVING=true;
function isPro(){return FORGIVING||state.profile.pro===true;}
function sorted(a){return a.slice().sort((x,y)=>(x.order??0)-(y.order??0));}
function normalizeOrders(){state.supps.forEach((s,i)=>{if(typeof s.order!=="number")s.order=i;});}

/* ---------- adherence engine ---------- */
function dueOn(s,key){
  if(s.paused)return false;
  if(s.freq==="asneeded")return false;
  if(s.created&&key<s.created)return false;
  if(s.freq==="daily")return true;
  if(s.freq==="custom"){const dow=(fromKey(key).getDay()+6)%7;return (s.days||[]).includes(dow);}
  return false;
}
function timesOf(s){return Math.max(1,Math.min(8,s.times||1));}
function doseKeys(s){const n=s.freq==="asneeded"?1:timesOf(s);const out=[s.id];for(let i=2;i<=n;i++)out.push(s.id+"#"+i);return out;}
function baseId(k){return k.split("#")[0];}
function dayStats(key){
  const log=state.logs[key]||{};
  const due=state.supps.filter(s=>dueOn(s,key));
  const denomSet=new Set();
  for(const s of due)for(const dk of doseKeys(s))denomSet.add(dk);
  // count taken sub-doses even if their supplement was later paused/removed, so history stays fair
  for(const k in log){if(log[k].s==="taken")denomSet.add(k);}
  // "not needed today" is not a miss — drop it from the day's maths entirely
  for(const k in log){if(log[k].s==="skipped"&&log[k].r==="Not needed today")denomSet.delete(k);}
  const denom=denomSet.size;
  let taken=0;for(const k of denomSet){if(log[k]&&log[k].s==="taken")taken++;}
  return {denom,taken,pct:denom?taken/denom:0,good:denom>0&&taken/denom>=0.8,neutral:denom===0};
}
function weekStats(monKey){
  const mon=fromKey(monKey);const tk=tkey();
  let good=0,taken=0,denom=0,days=[];
  for(let i=0;i<7;i++){
    const k=dkey(addDays(mon,i));
    if(k>tk){days.push({k,future:true});continue;}
    const st=dayStats(k);days.push({k,...st});
    if(st.good)good++;taken+=st.taken;denom+=st.denom;
  }
  return {good,taken,denom,pct:denom?Math.round(100*taken/denom):0,days};
}
function streakWeeks(){
  const target=state.profile.weeklyTarget;
  const thisMon=mondayOf(today());
  const EARN_EVERY=4;   // one freeze token per 4 consecutive good weeks
  const MAX_FREEZE=2;   // safety net, not a loophole
  // find the first week of activity
  const fu=firstUseKey();
  if(!fu)return {streak:0,alive:true,curGood:weekStats(dkey(thisMon)).good,freezes:0,usedFreeze:false,frozenWeeks:0};
  let m=mondayOf(fromKey(fu));
  // walk FORWARD from first week to last completed week, tracking streak + freezes
  let streak=0,freezes=0,goodRun=0,usedFreeze=false,frozenWeeks=0,guard=0;
  const lastCompletedMon=addDays(thisMon,-7); // current week handled separately
  while(dkey(m)<=dkey(lastCompletedMon)&&guard++<400){
    const ws=weekStats(dkey(m));
    if(ws.denom===0){m=addDays(m,7);continue;} // skip empty weeks (gaps)
    if(ws.good>=target){
      streak++;goodRun++;
      if(goodRun%EARN_EVERY===0)freezes=Math.min(MAX_FREEZE,freezes+1);
    }else if(freezes>0){
      freezes--;usedFreeze=true;frozenWeeks++;goodRun=0;streak++; // freeze saves this week
    }else{
      streak=0;goodRun=0; // streak broken; freezes persist as a fresh-start cushion? no — reset cushion too
      freezes=0;usedFreeze=false;frozenWeeks=0;
    }
    m=addDays(m,7);
  }
  // current week
  const cur=weekStats(dkey(thisMon));
  const remaining=6-((today().getDay()+6)%7);
  const curMet=cur.good>=target;
  const curAlive=curMet||cur.good+remaining+1>=target;
  if(curMet){streak++;goodRun++;if(goodRun%EARN_EVERY===0)freezes=Math.min(MAX_FREEZE,freezes+1);}
  return {streak,alive:curAlive,curGood:cur.good,freezes,usedFreeze,frozenWeeks};
}
function firstUseKey(){
  let min=null;
  for(const s of state.supps){if(s.created&&(!min||s.created<min))min=s.created;}
  for(const k in state.logs){if(!min||k<min)min=k;}
  return min;
}

function pourInto(container){
  const svg=container.querySelector("#jarsvg");if(!svg)return;
  const NS="http://www.w3.org/2000/svg";
  const fillRect=svg.querySelector("#jfill");
  const fy=fillRect?parseFloat(fillRect.getAttribute("y")):146;
  for(let i=0;i<6;i++){
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",58+i*5+(i%3)*3);c.setAttribute("cy",40);c.setAttribute("r",3.4);
    c.setAttribute("fill",currentSkin().fill);c.classList.add("pourdot");
    c.style.setProperty("--fall",(fy-42)+"px");
    c.style.animationDelay=(i*45)+"ms";
    svg.appendChild(c);setTimeout(()=>c.remove(),700+i*45);
  }
  svg.classList.remove("jarbounce");void svg.offsetWidth;svg.classList.add("jarbounce");
}
function confettiBurst(el){

    d.style.setProperty("--dy",(Math.random()*-180-40)+"px");
    document.body.appendChild(d);setTimeout(()=>d.remove(),1200);
  }
}

function hadPerfectWeek(){

let addDemoTimers=[];
function clearAddDemo(){addDemoTimers.forEach(t=>clearTimeout(t));addDemoTimers=[];}
function startAddDemo(){
  clearAddDemo();
  const T=(fn,ms)=>addDemoTimers.push(setTimeout(fn,ms));
  const run=()=>{
    const nameV=$("#pmNameV"),doseV=$("#pmDoseV"),unitV=$("#pmUnitV"),btn=$("#pmBtn"),list=$("#pmList"),cur=$("#pmCur");
    if(!nameV)return; // screen left
    // reset
    nameV.textContent="";doseV.textContent="";unitV.textContent="";list.innerHTML="";list.classList.remove("show");
    btn.classList.remove("press");$("#pmName").classList.add("focus");if(cur)cur.style.display="inline-block";
    const word="Tart Cherry";
    let i=0;
    const type=()=>{
      if(i<=word.length){nameV.textContent=word.slice(0,i);i++;T(type,75);}
      else{
        if(cur)cur.style.display="none";$("#pmName").classList.remove("focus");
        T(()=>{$("#pmDose").classList.add("focus");doseV.textContent="500";$("#pmDose").classList.remove("focus");},480);
        T(()=>{$("#pmUnit").classList.add("focus");unitV.textContent="mg";$("#pmUnit").classList.remove("focus");},920);
        T(()=>{btn.classList.add("press");},1500);
        T(()=>{
          btn.classList.remove("press");
          list.innerHTML=`<div class="pm-item"><span>🍒</span><div><b>Tart Cherry</b><i>500 mg</i></div><span class="pm-check">✓</span></div>`;
          list.classList.add("show");
        },1750);
        T(run,4200); // loop
      }
    };
    T(type,650);
  };
  run();
}

const SLOTS=[["morning","Morning"],["lunch","Lunch"],["evening","Evening"],["anytime","Anytime"]];
function renderToday(){
  const tk=tkey();const log=state.logs[tk]||{};
  const ds=dayStats(tk);
  const sk=streakWeeks();
  const asn=sorted(state.supps.filter(s=>!s.paused&&s.freq==="asneeded"));
  const active=state.supps.filter(s=>dueOn(s,tk));
  const fullPct=ds.denom?ds.taken/ds.denom:0;
  const done=ds.denom>0&&ds.taken===ds.denom;

  let rows="";
  for(const [slot,label] of SLOTS){
    const items=sorted(active.filter(s=>s.slot===slot));
    if(!items.length)continue;
    rows+=`<div class="sect"><h3>${label}</h3>${items.map(s=>rowsForSupp(s,log)).join("")}</div>`;
  }
  if(asn.length){
    rows+=`<div class="sect"><h3>As needed</h3>${asn.map(s=>rowHTML(s,s.id,log[s.id],true)).join("")}</div>`;
  }
  if(!rows){
    rows=`<div class="empty"><div class="big">🫙</div><h2>Nothing in the stack yet</h2><p class="sub" style="margin-top:6px">Add a supplement from the Stack tab to get going.</p></div>`;
  }

  const wk=weekStats(dkey(mondayOf(today())));
  const todayIdx=(today().getDay()+6)%7;
  const dots=wk.days.map((d,i)=>{
    let cls="wd";
    if(d.future)cls+=" future";
    else if(d.good)cls+=" good";
    else if(d.pct>0)cls+=" part";
    if(i===todayIdx)cls+=" today";
    return `<div class="${cls}"><div class="c">${d.good?"✓":""}</div>${DAYL[i]}</div>`;
  }).join("");

  $("#pgToday").innerHTML=`
    <div class="apphead">
      <div><div class="date">${fmtDate(today())}</div><h1>Today</h1></div>
      <div class="streakpill"><span class="fl">${sk.alive?"🔥":"🪵"}</span>${sk.streak} wk</div>
    </div>
    <div class="jarhero" id="heroJar">${jarSVG(fullPct,168)}
      <button class="jartap" id="jarTap" aria-label="Change Jack">👕 Dress Jack</button>
      <div class="jarsum">${ds.denom?`<b>${ds.taken}</b> of <b>${ds.denom}</b> taken${done?" — day done 🎉":""}`:"No scheduled doses today"}</div>
    </div>
    <div class="weekdots">${dots}</div>
    <div style="text-align:center;font-size:12.5px;font-weight:800;color:var(--ink-soft)">${wk.good} of ${state.profile.weeklyTarget} good days this week</div>
    <div id="checkinSlot"></div>
    <div id="lowStockSlot"></div>
    <div id="founderSlot"></div>
    ${rows}`;

  // wire rows
  const jt=$("#jarTap");if(jt)jt.onclick=(e)=>{e.stopPropagation();wardrobeSheet();};
  $("#pgToday").querySelectorAll("[data-take]").forEach(el=>{
    el.addEventListener("click",e=>{e.stopPropagation();toggleTake(el.dataset.take);});
  });
  $("#pgToday").querySelectorAll("[data-skip]").forEach(el=>{
    el.addEventListener("click",e=>{e.stopPropagation();skipSheet(el.dataset.skip);});
  });
  $("#pgToday").querySelectorAll(".row[data-rid]").forEach(el=>{
    el.addEventListener("click",()=>toggleTake(el.dataset.rid));
  });
  renderCheckinBanner();
  renderLowStock();
  renderFounderBanner();
}

function rowsForSupp(s,log){
  const keys=doseKeys(s);
  if(keys.length===1)return rowHTML(s,s.id,log[s.id]);
  return keys.map((k,i)=>rowHTML(s,k,log[k],false,`Dose ${i+1} of ${keys.length}`)).join("");
}
function rowHTML(s,dkey,entry,asneeded,doseLabel){
  const taken=entry&&entry.s==="taken";
  const skipped=entry&&entry.s==="skipped";
  const notNeeded=skipped&&entry.r==="Not needed today";
  const meta=[doseLabel||"",doseText(s),s.withFood?"🍽️ with food":""].filter(Boolean).join(" · ");
  const chip=skipped?(notNeeded?`<span class="chip ok">Not needed today ✓</span>`:`<span class="chip">Skipped · ${esc(entry.r||"")}</span>`):"";
  return `<div class="row ${taken?"taken":""} ${skipped?"skipped":""} ${notNeeded?"notneeded":""}" data-rid="${dkey}">
    <span class="em">${s.emoji}</span>
    <div class="info"><div class="nm">${esc(s.name)}</div>${meta?`<div class="ds">${meta}</div>`:""}
    ${chip}</div>
    ${!taken&&!asneeded?`<button class="ctl skip" data-skip="${dkey}" aria-label="Skip">✕</button>`:""}
    <button class="ctl take" data-take="${dkey}" aria-label="Take">✓</button>
  </div>`;
}
function toggleTake(id){
  const tk=tkey();
  track("take_toggle");
  if(!state.logs[tk])state.logs[tk]={};
  const log=state.logs[tk];
  const before=dayStats(tk);
  const supp=state.supps.find(x=>x.id===baseId(id));
  if(log[id]&&log[id].s==="taken"){
    // only restore stock if this take actually decremented it
    if(supp&&supp.trackStock&&typeof supp.stock==="number"&&log[id].dec)supp.stock+=1;
    delete log[id];
  }else{
    let dec=false;
    if(supp&&supp.trackStock&&typeof supp.stock==="number"&&supp.stock>0){supp.stock-=1;dec=true;}
    log[id]={s:"taken",t:Date.now(),dec};
  }
  save();
  const wasTaken=!log[id];
  renderToday();
  if(!wasTaken){ // just took it
    const jw=$("#heroJar");if(jw)pourInto(jw);
    const after=dayStats(tk);
    if(after.denom>0&&after.taken===after.denom&&before.taken!==before.denom){
      setTimeout(celebrate,300);
    }
  }
}
function skipSheet(dkey){
  const s=state.supps.find(x=>x.id===baseId(dkey));if(!s)return;
  openSheet(`
    <div class="sh-title">Skip ${esc(s.name)} today?</div>
    <div class="sh-sub">No judgement. A reason keeps your history honest.</div>
    ${SKIP_REASONS.map(r=>`<button class="opt" data-r="${r[1]}"><span class="em">${r[0]}</span>${r[1]}</button>`).join("")}
    <button class="btn ghost" id="skCancel" style="margin-top:10px">Cancel</button>
  `);
  $("#sheet").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const tk=tkey();if(!state.logs[tk])state.logs[tk]={};
    const before=dayStats(tk);
    state.logs[tk][dkey]={s:"skipped",r:b.dataset.r,t:Date.now()};track("skip");
    save();closeSheet();renderToday();
    // if marking this not-needed just completed the day, celebrate
    const after=dayStats(tk);
    if(after.denom>0&&after.taken===after.denom&&!(before.denom>0&&before.taken===before.denom)){

// how many dose entries (taken + skipped) were logged across a Mon..Sun week
function loggedInWeek(monKey){
  const mon=fromKey(monKey);let n=0;
  for(let i=0;i<7;i++){const l=state.logs[dkey(addDays(mon,i))];if(l)n+=Object.keys(l).length;}
  return n;
}
function lastWeekCandidate(){
  // most recent completed week (Mon..Sun before this week) that was due, after first use, not checked in
  const lastMon=dkey(addDays(mondayOf(today()),-7));
  if(state.checkins[lastMon])return null;
  const fu=firstUseKey();
  if(!fu||lastMon<dkey(mondayOf(fromKey(fu))))return null;
  if(weekStats(lastMon).denom===0)return null;
  return lastMon;
}
function pendingCheckinWeek(){
  // a feel check-in only makes sense for a week with real logging
  const wk=lastWeekCandidate();
  return wk&&loggedInWeek(wk)>0?wk:null;
}
function pendingWelcomeBack(){
  // a lapsed week (nothing logged): welcome them back once, never show a report card
  const wk=lastWeekCandidate();
  if(!wk||loggedInWeek(wk)>0)return null;
  return (state.profile.welcomed||[]).includes(wk)?null:wk;
}
function renderCheckinBanner(){
  const slot=$("#checkinSlot");if(!slot)return;

function maybeCheckinPrompt(){

/* ---------- drag to reorder ---------- */
let dragMoved=false;
function startDrag(ev,row){
  ev.preventDefault();
  dragMoved=false;
  const rows=[...$("#pgStack").querySelectorAll('.row[data-act="1"]')];
  const idx=rows.indexOf(row);if(idx<0)return;
  const rh=row.offsetHeight+10;
  let target=idx;
  const startY=ev.clientY;
  row.style.position="relative";row.style.zIndex=5;
  row.style.boxShadow="0 12px 28px rgba(46,42,51,.2)";row.style.transition="none";
  const move=e=>{
    const dy=e.clientY-startY;
    if(Math.abs(dy)>4)dragMoved=true;
    row.style.transform=`translateY(${dy}px) scale(1.02)`;
    let t=Math.max(0,Math.min(rows.length-1,idx+Math.round(dy/rh)));
    if(t!==target){
      target=t;
      rows.forEach((r,i)=>{
        if(r===row)return;
        let sh=0;
        if(idx<target&&i>idx&&i<=target)sh=-rh;
        else if(idx>target&&i>=target&&i<idx)sh=rh;
        r.style.transition="transform .15s";
        r.style.transform=sh?`translateY(${sh}px)`:"";
      });
    }
  };
  const up=()=>{
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);
    document.removeEventListener("pointercancel",up);
    if(target!==idx){
      const ids=rows.map(r=>r.dataset.rid);
      const movedId=ids.splice(idx,1)[0];
      ids.splice(target,0,movedId);
      ids.forEach((id,i)=>{const s=state.supps.find(x=>x.id===id);if(s)s.order=i;});
      let n=ids.length;
      sorted(state.supps.filter(s=>s.paused)).forEach(s=>{s.order=n++;});
      save();
    }
    renderStack();renderToday();
    setTimeout(()=>{dragMoved=false;},60);
  };
  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",up);
  document.addEventListener("pointercancel",up);
}

    state={v:1,onboarded:false,profile:{age:"30s",goal:"training",weeklyTarget:5,reminderTime:"08:00"},supps:[],logs:{},checkins:{}};
    OB.step=0;OB.age=null;OB.goal=null;OB.target=null;OB.demoDone=false;OB.picks=null;OB.picksGoal=null;
    closeSheet();
    $("#app").classList.remove("on");$("#ob").classList.add("on");
    obRender();
  };
}

/* ---------- WEEKS ---------- */
// copy for the streak card when this week can no longer hit target (reads state, changes nothing).
// A freeze is only promised when streakWeeks' forward walk will spend one at week end:
// streak > 0, a freeze banked, and something due this week (a nothing-due week is skipped as a gap).
function streakOutLine(sk){
  if(sk.streak===0)return "Fresh start Monday. Jack's ready when you are.";
  const curDue=weekStats(dkey(mondayOf(today()))).denom>0;
  if(sk.freezes>0&&curDue)return "Your freeze has this week covered. Back on it Monday.";
  return "This week's slipped, and that's OK. Fresh start Monday.";
}
function renderWeeks(){
  const sk=streakWeeks();
  const thisMon=mondayOf(today());
  const fu=firstUseKey();
  let weekRows="";let count=0;
  if(fu){
    let m=thisMon;
    const firstMon=mondayOf(fromKey(fu));
    while(dkey(m)>=dkey(firstMon)&&count<12){
      const mk=dkey(m);const ws=weekStats(mk);
      const ci=state.checkins[mk];
      const isCur=mk===dkey(thisMon);
      const tgt=state.profile.weeklyTarget;
      const met=ws.good>=tgt;
      const dots=ws.days.map(d=>`<span class="gd ${d.future?"fut":d.good?"on":d.pct>0?"part":""}"></span>`).join("");
      weekRows+=`<div class="wkrow">
        <div class="wkmain">
          <div class="wktop"><span class="lbl">${isCur?"This week":fmtShort(fromKey(mk))}</span>${ci?`<span class="fe">${FEELS[ci.feel-1]}</span>`:""}</div>
          <div class="gddots">${dots}</div>
          <div class="sub2">${ws.good} of ${tgt} good days${met?' · <span class="hit">target hit ✓</span>':""}</div>
        </div>
      </div>`;
      m=addDays(m,-7);count++;
    }
  }
  // insight
  let insight="";
  const cis=Object.values(state.checkins);
  if(cis.length>=3){
    if(!isPro()){
      insight=`<div class="card insight"><div class="tt">🔒 Pro insight ready</div><p>Three check-ins logged — Jack can now connect how you feel to what you take.</p><button class="btn" id="insUnlock" style="margin-top:12px">See what's working</button></div>`;
    }else{
      const hi=cis.filter(c=>c.feel>=4),lo=cis.filter(c=>c.feel<=3);
      if(hi.length&&lo.length){
        const avg=a=>Math.round(a.reduce((x,c)=>x+c.pct,0)/a.length);
        insight=`<div class="card insight"><div class="tt">Early pattern</div><p>On weeks you felt good you averaged <b>${avg(hi)}%</b> of your doses, against <b>${avg(lo)}%</b> on rougher weeks. Worth keeping Jack full.</p></div>`;
      }else{
        insight=`<div class="card insight"><div class="tt">Early pattern</div><p>Your check-ins are all similar so far — a few more varied weeks will sharpen this insight.</p></div>`;
      }
    }
  }else{
    insight=`<div class="card insight"><div class="tt">Coming soon</div><p>After three Sunday check-ins, Jack starts connecting how you feel to what you took.</p></div>`;
  }
  $("#pgWeeks").innerHTML=`
    <div class="apphead"><div><div class="date">Progress</div><h1>Weeks</h1></div></div>
    ${insight}
    <button class="sharebtn" id="shareWeek">📤 Share my week</button>
    <div class="card"><div class="bigstreak"><span class="fl">${sk.alive?"🔥":"🪵"}</span>
      <div><div class="n">${sk.streak} week${sk.streak===1?"":"s"}</div>
      <div class="l">${sk.alive?(sk.curGood>=state.profile.weeklyTarget?"This week's target hit, cruise mode":"Still alive: "+(state.profile.weeklyTarget-sk.curGood)+" more good day"+(state.profile.weeklyTarget-sk.curGood===1?"":"s")+" needed this week"):streakOutLine(sk)}</div></div>
    </div>${sk.freezes>0||sk.usedFreeze?`<div class="freezerow">${sk.freezes>0?`<span class="freezechip">❄️ ${sk.freezes} freeze${sk.freezes===1?"":"s"} banked</span>`:""}${sk.usedFreeze?`<span class="freezechip used">❄️ saved a tough week</span>`:""}</div>`:""}</div>
    <div class="card">${weekRows||'<p class="sub">Your weeks will appear here once you start logging.</p>'}</div>`;
  const sw=$("#shareWeek");if(sw)sw.onclick=shareCardSheet;
  const iu=$("#insUnlock");if(iu)iu.onclick=()=>paywallSheet("Unlock the feel-correlation insight.");
}

/* ---------- misc ---------- */
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- boot ---------- */
(async function(){
  await load();
  normalizeOrders();
  if(state.onboarded){enterApp();}
  else{obRender();}
})();
